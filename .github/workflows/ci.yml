name: CI

# Runs both test suites on every push and pull request. The .NET library and the Rust → WASM
# browser core implement the same .pqfe format; the cross-implementation tests only protect
# byte-compatibility if BOTH suites run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET — build & test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # 8.0.x provides the runtime for the net8.0 test leg; 10.0.x is the build SDK.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test (with coverage; default lane, fast)
        # Excludes the LongRunning category so every push stays fast across all three OSes.
        # The fuller long-running lane runs once on Linux below.
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=LongRunning" --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/coverage"

      - name: Test (LongRunning lane, Linux only)
        # Big-payload tests (e.g. max-chunk-size 16 MiB round-trip) that don't need to run
        # on every OS leg. Always run after the fast lane has already produced coverage data,
        # so this lane writes to a separate directory and doesn't feed Codecov.
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category=LongRunning"

      - name: Upload coverage to Codecov
        # Token-free for public repos. Only upload from one matrix leg to avoid double-counting.
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: ${{ runner.temp }}/coverage
          fail_ci_if_error: false
          verbose: false

  aot:
    name: .NET — AOT publish smoke test
    # IsAotCompatible=true is set on the core library; this job exercises a real
    # native-AOT publish of the CLI sample and round-trips a file end-to-end so we
    # catch any regression that would slip past the analyzers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT prerequisites
        # The .NET native-AOT toolchain on Linux needs clang and zlib headers.
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish CLI sample with PublishAot=true
        run: |
          dotnet publish samples/Pqfe.Cli/Pqfe.Cli.csproj \
            --configuration Release \
            -p:PublishAot=true \
            -o "$RUNNER_TEMP/pqfe-aot"

      - name: Round-trip a file with the AOT-published binary
        env:
          PQFE_PASS: 'aot-smoke-test-passphrase'
        run: |
          set -euo pipefail
          PQFE="$RUNNER_TEMP/pqfe-aot/pqfe"
          test -x "$PQFE" || { echo "AOT publish produced no executable at $PQFE"; ls -la "$RUNNER_TEMP/pqfe-aot"; exit 1; }
          echo "the quick brown fox" > "$RUNNER_TEMP/plain.txt"
          "$PQFE" encrypt "$RUNNER_TEMP/plain.txt" "$RUNNER_TEMP/c.pqfe" --passphrase-env PQFE_PASS
          "$PQFE" decrypt "$RUNNER_TEMP/c.pqfe"    "$RUNNER_TEMP/out.txt" --passphrase-env PQFE_PASS
          diff "$RUNNER_TEMP/plain.txt" "$RUNNER_TEMP/out.txt"

      - name: Sign and verify with the AOT-published binary
        # Exercises the Ed25519 + ML-DSA-65 signing path (BouncyCastle) under native AOT,
        # including the fail-closed branch: a tampered file must be rejected with exit 65.
        env:
          PQFE_PASS: 'aot-smoke-test-passphrase'
        run: |
          set -euo pipefail
          PQFE="$RUNNER_TEMP/pqfe-aot/pqfe"
          "$PQFE" keygen "$RUNNER_TEMP/smoke.key"
          "$PQFE" sign   "$RUNNER_TEMP/c.pqfe" "$RUNNER_TEMP/smoke.key"
          "$PQFE" verify "$RUNNER_TEMP/c.pqfe" "$RUNNER_TEMP/smoke.key.pub"
          # Same flow with a passphrase-protected (PQKF) key file, so the encrypted
          # key-file import path (ExportEncrypted/ImportEncrypted + Argon2id) runs under AOT.
          "$PQFE" keygen "$RUNNER_TEMP/enc.key" --encrypt --passphrase-env PQFE_PASS
          "$PQFE" sign   "$RUNNER_TEMP/plain.txt" "$RUNNER_TEMP/enc.key" --passphrase-env PQFE_PASS
          "$PQFE" verify "$RUNNER_TEMP/plain.txt" "$RUNNER_TEMP/enc.key.pub"
          echo tamper >> "$RUNNER_TEMP/c.pqfe"
          if "$PQFE" verify "$RUNNER_TEMP/c.pqfe" "$RUNNER_TEMP/smoke.key.pub"; then
            echo "tampered file verified — fail-closed contract broken" >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 65 || { echo "expected exit 65 for a bad signature, got $rc" >&2; exit 1; }
          fi

  rust:
    name: Rust/WASM — test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable) + wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Test (decrypts the .NET known-answer vectors)
        working-directory: samples/pqfe-wasm
        run: cargo test --release --locked

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build the WebAssembly package
        working-directory: samples/pqfe-wasm
        run: wasm-pack build --target web --release --out-dir ../pqfe-web/pkg

  interop:
    name: Cross-implementation interop (.NET ⇄ Rust)
    # Live byte-compatibility proof: fresh random payloads every run, encrypted by one
    # implementation and decrypted by the other, in both directions, across chunk-boundary
    # sizes. Complements the pinned known-answer vectors, which cannot catch drift on
    # inputs they don't cover. Covers both the passphrase key source and the X25519 +
    # ML-KEM-768 hybrid recipient mode (KeySource 3/4), with keys generated on each side
    # used by the other.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - name: Build the Rust interop driver
        working-directory: samples/pqfe-wasm
        run: cargo build --release --locked --example pqfe_io

      - name: Build the .NET CLI
        run: dotnet publish samples/Pqfe.Cli/Pqfe.Cli.csproj -c Release -o "$RUNNER_TEMP/pqfe-cli"

      - name: Build the .NET hybrid interop driver
        run: dotnet publish samples/PqfeHybridInterop/PqfeHybridInterop.csproj -c Release -o "$RUNNER_TEMP/pqfe-hybrid"

      - name: Round-trip fresh payloads in both directions
        run: |
          set -euo pipefail
          DOTNET="$RUNNER_TEMP/pqfe-cli/pqfe"
          RUST="samples/pqfe-wasm/target/release/examples/pqfe_io"
          export PQFE_PASS="$(openssl rand -hex 24)"

          # Fixed sizes straddle the 64 KiB chunk boundary (empty, tiny, multi-chunk); the
          # random sizes make this a *differential* check that explores new points each run
          # rather than re-testing the same six every time.
          RANDOM_SIZES="$(for _ in $(seq 5); do echo $(( RANDOM * RANDOM % 5242880 )); done)"
          for size in 0 1 65535 65536 65537 5242880 $RANDOM_SIZES; do
            head -c "$size" /dev/urandom > "$RUNNER_TEMP/plain.bin"

            # --force: the loop reuses these output paths every iteration, and the CLI now
            # refuses to overwrite an existing output without it.
            "$DOTNET" encrypt "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/dotnet.pqfe" --passphrase-env PQFE_PASS --force
            "$RUST"   decrypt "$RUNNER_TEMP/dotnet.pqfe" "$RUNNER_TEMP/dotnet.out"
            cmp "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/dotnet.out"

            "$RUST"   encrypt "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/rust.pqfe"
            "$DOTNET" decrypt "$RUNNER_TEMP/rust.pqfe" "$RUNNER_TEMP/rust.out" --passphrase-env PQFE_PASS --force
            cmp "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/rust.out"

            echo "size $size: both directions OK"
          done

      - name: Argon2id container crosses implementations
        run: |
          set -euo pipefail
          DOTNET="$RUNNER_TEMP/pqfe-cli/pqfe"
          RUST="samples/pqfe-wasm/target/release/examples/pqfe_io"
          export PQFE_PASS="$(openssl rand -hex 24)"

          head -c 100000 /dev/urandom > "$RUNNER_TEMP/plain.bin"
          "$DOTNET" encrypt "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/argon.pqfe" --argon2id --passphrase-env PQFE_PASS
          "$RUST"   decrypt "$RUNNER_TEMP/argon.pqfe" "$RUNNER_TEMP/argon.out"
          cmp "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/argon.out"
          echo "Argon2id .NET → Rust OK"

      - name: Fail-closed agreement (wrong passphrase rejected by both)
        run: |
          set -euo pipefail
          DOTNET="$RUNNER_TEMP/pqfe-cli/pqfe"
          RUST="samples/pqfe-wasm/target/release/examples/pqfe_io"
          export PQFE_PASS="$(openssl rand -hex 24)"
          export PQFE_WRONG="not-the-passphrase"

          head -c 4096 /dev/urandom > "$RUNNER_TEMP/plain.bin"
          "$DOTNET" encrypt "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/c.pqfe" --passphrase-env PQFE_PASS

          if PQFE_PASS="$PQFE_WRONG" "$RUST" decrypt "$RUNNER_TEMP/c.pqfe" "$RUNNER_TEMP/x.out"; then
            echo "Rust accepted a wrong passphrase — fail-closed violation" >&2; exit 1
          fi
          "$RUST" encrypt "$RUNNER_TEMP/plain.bin" "$RUNNER_TEMP/r.pqfe"
          if "$DOTNET" decrypt "$RUNNER_TEMP/r.pqfe" "$RUNNER_TEMP/y.out" --passphrase-env PQFE_WRONG; then
            echo ".NET accepted a wrong passphrase — fail-closed violation" >&2; exit 1
          fi
          echo "Both implementations fail closed on a wrong passphrase"

      - name: Hybrid recipient round-trips (.NET ⇄ Rust)
        run: |
          set -euo pipefail
          DHYB="$RUNNER_TEMP/pqfe-hybrid/pqfe-hybrid-interop"
          RUST="samples/pqfe-wasm/target/release/examples/pqfe_io"
          W="$RUNNER_TEMP/hyb"; mkdir -p "$W"

          # Keys generated on each side must be usable by the other (standard FIPS 203 / RFC 7748
          # encodings), so cross both key origins and both encrypt/decrypt directions.
          "$DHYB" keygen-hybrid "$W/d.pub" "$W/d.priv"
          "$RUST" keygen-hybrid "$W/r.pub" "$W/r.priv"

          for size in 0 1 65535 65536 65537 1048576; do
            head -c "$size" /dev/urandom > "$W/plain.bin"

            # Rust encrypts to a .NET-generated key; .NET decrypts.
            "$RUST" encrypt-hybrid "$W/plain.bin" "$W/r2d.pqfe" "$W/d.pub"
            "$DHYB" decrypt-hybrid "$W/r2d.pqfe" "$W/r2d.out" "$W/d.priv"
            cmp "$W/plain.bin" "$W/r2d.out"

            # .NET encrypts to a Rust-generated key; Rust decrypts.
            "$DHYB" encrypt-hybrid "$W/plain.bin" "$W/d2r.pqfe" "$W/r.pub"
            "$RUST" decrypt-hybrid "$W/d2r.pqfe" "$W/d2r.out" "$W/r.priv"
            cmp "$W/plain.bin" "$W/d2r.out"

            echo "hybrid size $size: both directions OK"
          done

          # Multi-recipient (KeySource 4): three recipients, decrypt with the MIDDLE one, from
          # both container origins — exercises the block scan skipping a non-matching block.
          "$DHYB" keygen-hybrid "$W/a.pub" "$W/a.priv"
          "$DHYB" keygen-hybrid "$W/b.pub" "$W/b.priv"
          "$DHYB" keygen-hybrid "$W/c.pub" "$W/c.priv"
          head -c 200000 /dev/urandom > "$W/plain.bin"

          "$RUST" encrypt-hybrid "$W/plain.bin" "$W/rmulti.pqfe" "$W/a.pub" "$W/b.pub" "$W/c.pub"
          "$DHYB" decrypt-hybrid "$W/rmulti.pqfe" "$W/rmulti.out" "$W/b.priv"
          cmp "$W/plain.bin" "$W/rmulti.out"

          "$DHYB" encrypt-hybrid "$W/plain.bin" "$W/dmulti.pqfe" "$W/a.pub" "$W/b.pub" "$W/c.pub"
          "$RUST" decrypt-hybrid "$W/dmulti.pqfe" "$W/dmulti.out" "$W/b.priv"
          cmp "$W/plain.bin" "$W/dmulti.out"
          echo "hybrid multi-recipient (middle) both directions OK"

      - name: Hybrid fail-closed agreement (stranger key rejected by both)
        run: |
          set -euo pipefail
          DHYB="$RUNNER_TEMP/pqfe-hybrid/pqfe-hybrid-interop"
          RUST="samples/pqfe-wasm/target/release/examples/pqfe_io"
          W="$RUNNER_TEMP/hybfail"; mkdir -p "$W"

          "$DHYB" keygen-hybrid "$W/good.pub" "$W/good.priv"
          "$DHYB" keygen-hybrid "$W/stranger.pub" "$W/stranger.priv"
          head -c 4096 /dev/urandom > "$W/plain.bin"

          "$RUST" encrypt-hybrid "$W/plain.bin" "$W/c.pqfe" "$W/good.pub"
          if "$DHYB" decrypt-hybrid "$W/c.pqfe" "$W/x.out" "$W/stranger.priv"; then
            echo ".NET accepted a stranger key on a Rust container — fail-closed violation" >&2; exit 1
          fi

          "$DHYB" encrypt-hybrid "$W/plain.bin" "$W/d.pqfe" "$W/good.pub"
          if "$RUST" decrypt-hybrid "$W/d.pqfe" "$W/y.out" "$W/stranger.priv"; then
            echo "Rust accepted a stranger key on a .NET container — fail-closed violation" >&2; exit 1
          fi
          echo "Both implementations fail closed on a non-recipient key"

  audit:
    name: Rust — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        working-directory: samples/pqfe-wasm
        run: cargo audit
