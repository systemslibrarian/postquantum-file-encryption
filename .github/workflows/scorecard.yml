name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard supply-chain risk check on a weekly cadence and on demand.
# Results are surfaced as SARIF in the repository's Security tab and published to the public
# OpenSSF dashboard, which is the standard signal enterprises use to evaluate a dependency's
# supply-chain hygiene. This is especially important for a cryptography library on NuGet.

on:
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 1'   # Mondays, 05:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish results to the public Scorecard dashboard
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact (raw results)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v3
        with:
          sarif_file: results.sarif
