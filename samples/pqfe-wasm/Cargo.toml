[package]
name = "pqfe-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser (WebAssembly) re-implementation of the PostQuantum.FileEncryption .pqfe v2 container format"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
aes-gcm = "0.11"
pbkdf2 = "0.13"
sha2 = "0.11"
argon2 = "0.5"
getrandom = { version = "0.2", features = ["js"] }
# ml-kem 0.3 -> rand_core 0.10 pulls getrandom 0.4, which renamed the wasm backend
# feature from "js" to "wasm_js". Both versions coexist in the dependency graph, so the
# 0.4 instance is surfaced here under a rename to enable wasm_js without colliding with
# the 0.2 alias above. Mirrors bindings/wasm in PostQuantum.FileFormat.
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# Hybrid recipient mode (KeySource 3/4): ML-KEM-768 + X25519 + HKDF-SHA256, matching the
# .NET Hybrid package. Same digest-0.11 RustCrypto generation as sha2/pbkdf2 above.
ml-kem = "0.3"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets"] }
rand_core = "0.10"

[dev-dependencies]
base64 = "0.23"

[profile.release]
opt-level = "z"
lto = true
