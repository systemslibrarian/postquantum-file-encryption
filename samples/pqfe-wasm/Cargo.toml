[package]
name = "pqfe-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser (WebAssembly) re-implementation of the PostQuantum.FileEncryption .pqfe v2 container format"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
aes-gcm = "0.10"
pbkdf2 = "0.13"
sha2 = "0.11"
argon2 = "0.5"
getrandom = { version = "0.2", features = ["js"] }
# Hybrid recipient mode (KeySource 3/4): ML-KEM-768 + X25519 + HKDF-SHA256, matching the
# .NET Hybrid package. Same digest-0.11 RustCrypto generation as sha2/pbkdf2 above.
ml-kem = "0.2"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets"] }
rand_core = "0.6"

[dev-dependencies]
base64 = "0.23"

[profile.release]
opt-level = "z"
lto = true
